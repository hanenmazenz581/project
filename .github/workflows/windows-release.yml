name: Build StudioCut Pro for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout build manifest
        uses: actions/checkout@v4

      - name: Reassemble and extract source package
        shell: pwsh
        run: |
          $parts = @(
            'studiocut-source.zip.b64.part00',
            'studiocut-source.zip.b64.part01',
            'studiocut-source.zip.b64.part02',
            'studiocut-source.zip.b64.part03',
            'studiocut-source.zip.b64.part04',
            'studiocut-source.zip.b64.part05'
          )
          $encoded = ($parts | ForEach-Object { (Get-Content -Raw $_).Trim() }) -join ''
          $bytes = [Convert]::FromBase64String($encoded)
          [IO.File]::WriteAllBytes('studiocut-source.zip', $bytes)
          Expand-Archive -Path 'studiocut-source.zip' -DestinationPath 'source' -Force
          if (-not (Test-Path 'source\main.py')) { throw 'Source archive is incomplete.' }
          if (-not (Test-Path 'source\assets\library_catalog.json')) { throw 'Effect catalog is missing.' }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Align build script with Python 3.12
        shell: pwsh
        run: |
          $batch = Get-Content -Raw 'source\build_windows.bat'
          $batch = $batch.Replace('py -3.11', 'py -3.12')
          Set-Content -Path 'source\build_windows.bat' -Value $batch -Encoding ascii

      - name: Fix FFmpeg validation output handling
        shell: pwsh
        run: |
          $path = 'source\tools\fetch_ffmpeg.ps1'
          $script = Get-Content -Raw $path
          $script = $script.Replace(' -version | Select-Object -First 2', ' -version')
          Set-Content -Path $path -Value $script -Encoding utf8

      - name: Support PyInstaller 6 internal runtime layout
        shell: pwsh
        run: |
          $mainPath = 'source\main.py'
          $main = Get-Content -Raw $mainPath
          $needle = "candidates.append(Path(sys.executable).parent / 'ffmpeg' / filename)"
          $replacement = $needle + "`n        candidates.append(Path(sys.executable).parent / '_internal' / 'ffmpeg' / filename)"
          if (-not $main.Contains($needle)) { throw 'FFmpeg runtime lookup anchor was not found.' }
          $main = $main.Replace($needle, $replacement)
          Set-Content -Path $mainPath -Value $main -Encoding utf8

          $batchPath = 'source\build_windows.bat'
          $batch = Get-Content -Raw $batchPath
          $batch = $batch.Replace('if not exist "dist\StudioCutPro\ffmpeg\ffmpeg.exe" goto failed', 'if not exist "dist\StudioCutPro\ffmpeg\ffmpeg.exe" if not exist "dist\StudioCutPro\_internal\ffmpeg\ffmpeg.exe" goto failed')
          $batch = $batch.Replace('if not exist "dist\StudioCutPro\ffmpeg\ffprobe.exe" goto failed', 'if not exist "dist\StudioCutPro\ffmpeg\ffprobe.exe" if not exist "dist\StudioCutPro\_internal\ffmpeg\ffprobe.exe" goto failed')
          Set-Content -Path $batchPath -Value $batch -Encoding ascii

      - name: Fix Inno Setup comment syntax
        shell: pwsh
        run: |
          $path = 'source\installer\StudioCutPro.iss'
          $iss = Get-Content -Raw $path
          $iss = $iss -replace '(?m)^# Inno Setup 6 installer script', '; Inno Setup 6 installer script'
          Set-Content -Path $path -Value $iss -Encoding utf8

      - name: Build application and installer
        shell: cmd
        working-directory: source
        env:
          CI: 'true'
        run: build_windows.bat

      - name: Verify installer exists
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'source\release' -Filter 'StudioCutPro-Setup-*.exe' -File | Select-Object -First 1
          if (-not $installer) { throw 'Installer EXE was not produced.' }
          Get-Item $installer.FullName | Format-List FullName,Length

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: StudioCutPro-Windows-Installer
          path: source/release/StudioCutPro-Setup-*.exe
          if-no-files-found: error
          retention-days: 14

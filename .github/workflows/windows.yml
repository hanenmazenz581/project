name: Build StudioCut Pro (Windows x64)
concurrency:
  group: studiocut-windows-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [main, studiocut-pro-rebuild]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtmultimedia
          cache: true
      - name: Install FFmpeg
        shell: pwsh
        run: choco install ffmpeg -y --no-progress
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Deploy Qt runtime
        shell: pwsh
        run: |
          windeployqt --release build/Release/StudioCutPro.exe
          Copy-Item (Get-Command ffmpeg).Source build/Release/ffmpeg.exe
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/Release/* dist/ -Recurse
          Compress-Archive -Path dist/* -DestinationPath StudioCutPro-Windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: StudioCutPro-Windows-x64
          path: StudioCutPro-Windows-x64.zip
          if-no-files-found: error
